<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 15</title>

    <style>
        body {
            margin: 10px;
        }

        .top {
            width: 100%;
            height: 120px;
            border: 1px solid gray;
        }

        .middle {
            display: flex;
            width: 100%;
            height: 220px;
        }

        .left {
            width: 40%;
            height: 100%;
        }

        .right {
            width: 60%;
            height: 100%;
        }

        .bottom {
            width: 100%;
            height: 100px;
        }

        iframe {
            border: 1px solid gray;
        }
    </style>
</head>

<body>

    <iframe class="top" src="top.html"></iframe>

    <div class="middle">
        <iframe class="left" src="left.html"></iframe>
        <iframe class="right" src="right.html"></iframe>
    </div>

    <iframe class="bottom" src="bottom.html"></iframe>

</body>
</html>
